name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Moindre privilège : lecture seule par défaut. Le workflow tourne aussi sur
# les pull requests — sur un dépôt public, n'importe qui peut en ouvrir une.
# Seul le job qui publie la release demande l'écriture.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff (config dans pyproject.toml)
        run: |
          pip install ruff
          ruff check .

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Dépendances (verrouillées)
        run: |
          pip install -r requirements-lock.txt
          pip install pytest
      - name: Dépendances OCR (Linux — le test OCR ne doit plus être sauté)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-fra ghostscript
          pip install ocrmypdf pillow
      - name: Tests (hors ligne — LLM/embeddings mockés ; -rs affiche tout skip)
        run: pytest tests/ -q -rs

  tests-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Tests UI (happy-dom — seule couverture du frontend)
        run: |
          bun tests/ui/test_questions_ui.mjs
          bun tests/ui/test_robustesse_ui.mjs

  build-windows:
    needs: [tests, tests-ui, lint]
    runs-on: windows-latest
    permissions:
      contents: write  # `gh release create` sur tag (étape « Release publiée »)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Garde-fou — le tag git doit égaler app.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $ver = python -c "from app import __version__; print(__version__)"
          if ($tag -ne $ver) {
            throw "Tag v$tag mais app.__version__ = $ver — bumpez app/__init__.py avant de tagger."
          }
      - name: Dépendances (verrouillées — build reproductible)
        run: |
          pip install -r requirements-lock.txt
          pip install pyinstaller pillow
      - name: Icône
        run: python packaging/windows/genere_icone.py packaging/windows/icone.ico
      - name: Build PyInstaller (onedir)
        run: pyinstaller packaging/pyinstaller/BilanOrtho.spec --noconfirm
      - name: Données embarquées — le VAD Silero est dans le build
        shell: pwsh
        run: |
          $vad = Get-ChildItem "dist\BilanOrtho\_internal\faster_whisper\assets\silero_vad*.onnx" -ErrorAction SilentlyContinue
          if (-not $vad) { throw "Modèle VAD Silero absent du build — la dictée planterait (collect_data_files('faster_whisper') dans le spec)" }
          Write-Host "VAD embarqué : $($vad.Name)"
      - name: Données embarquées — les polices reportlab sont dans le build
        shell: pwsh
        run: |
          # Même classe de bug que le VAD : reportlab lit ses métriques de
          # polices comme données de paquet. Absentes, l'export PDF échoue dans
          # l'app compilée seulement — invisible en développement et en tests.
          $afm = Get-ChildItem "dist\BilanOrtho\_internal\reportlab" -Recurse -Filter "*.afm" -ErrorAction SilentlyContinue
          if (-not $afm) { throw "Métriques de polices reportlab absentes du build — l'export PDF planterait (collect_all('reportlab') dans le spec)" }
          Write-Host "Polices reportlab embarquées : $($afm.Count) fichier(s) .afm"
      - name: Données embarquées — le pack de bilans d'exemple est dans le build
        shell: pwsh
        run: |
          # « Charger les bilans d'exemple » lit data/reference au runtime :
          # sans ces fichiers dans le build, le bouton échouerait dans l'app
          # compilée seulement.
          $pack = Get-ChildItem "dist\BilanOrtho\_internal\data\reference\*.txt" -ErrorAction SilentlyContinue
          if (-not $pack -or $pack.Count -lt 11) { throw "Pack de bilans d'exemple incomplet dans le build ($($pack.Count) fichier(s), 11 attendus) — datas du spec" }
          Write-Host "Pack embarqué : $($pack.Count) bilan(s) fictif(s)"
      - name: Fumée — le binaire compilé démarre et répond
        shell: pwsh
        run: |
          $env:BILAN_ORTHO_DATA_DIR = "$env:TEMP\bilan-ortho-fumee"
          $p = Start-Process -FilePath "dist\BilanOrtho\BilanOrtho.exe" -PassThru
          $ok = $false
          foreach ($i in 1..90) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/status" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { Start-Sleep -Milliseconds 500 }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "Le binaire n'a pas répondu sur /api/status" }
          Write-Host "Réponse : $($r.Content)"
      - name: Fumée — la dictée fonctionne dans le binaire gelé
        shell: pwsh
        run: |
          # La classe de bug qui a cassé la dictée entre v1.2 et v1.4 (données
          # faster-whisper absentes du build PyInstaller) n'est détectable
          # qu'en exerçant /api/transcribe sur le binaire compilé.
          $env:BILAN_ORTHO_DATA_DIR = "$env:TEMP\bilan-ortho-fumee-dictee"
          $p = Start-Process -FilePath "dist\BilanOrtho\BilanOrtho.exe" -PassThru
          try {
            $ok = $false
            foreach ($i in 1..90) {
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/status" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ok) { throw "Le binaire n'a pas répondu sur /api/status" }
            # Coffre de test + modèle Whisper « tiny » (léger) sur CPU.
            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8000/api/unlock" `
              -ContentType "application/json" -Body '{"passphrase":"passphrase-de-fumee-ci"}' | Out-Null
            Invoke-RestMethod -Method Put -Uri "http://127.0.0.1:8000/api/config" `
              -ContentType "application/json" -Body '{"overrides":{"stt":{"model":"tiny","device":"cpu"}}}' | Out-Null
            # 1 s de silence WAV 16 kHz : exerce tout le pipeline (VAD compris).
            python -c "import wave; w=wave.open(r'$env:TEMP\silence.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000); w.writeframes(b'\x00\x00'*16000); w.close()"
            $code = & curl.exe -s -o "$env:TEMP\transcribe.json" -w "%{http_code}" `
              -F "audio=@$env:TEMP\silence.wav;type=audio/wav" http://127.0.0.1:8000/api/transcribe
            if ($code -ne "200") {
              Get-Content "$env:TEMP\transcribe.json" -ErrorAction SilentlyContinue
              throw "La dictée a échoué dans le binaire gelé (HTTP $code)."
            }
            Write-Host "Dictée OK : $(Get-Content $env:TEMP\transcribe.json)"
            # Le binaire n'était sondé que sur l'API : si app/static sortait du
            # spec PyInstaller, la CI restait verte et l'app livrée affichait une
            # page blanche. Même angle mort pour l'export PDF (reportlab et ses
            # polices .afm) et pour le pack d'exemples (importer.PACK_DIR en mode
            # gelé) — revue 2026-08-11, 9.2.
            $page = Invoke-WebRequest -Uri "http://127.0.0.1:8000/" -UseBasicParsing -TimeoutSec 10
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch "Bilan Ortho") {
              throw "La page d'accueil du binaire gelé est vide ou absente."
            }
            $b = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8000/api/bilans" `
              -ContentType "application/json" -Body '{"domaines":[]}'
            $pdf = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/bilans/$($b.id)/export?format=pdf" `
              -UseBasicParsing -TimeoutSec 60
            if ($pdf.StatusCode -ne 200 -or "$($pdf.Headers['Content-Type'])" -notmatch "pdf" -or $pdf.RawContentLength -lt 500) {
              throw "L'export PDF a échoué dans le binaire gelé (HTTP $($pdf.StatusCode), $($pdf.RawContentLength) octets)."
            }
            Write-Host "Page et export PDF OK ($($pdf.RawContentLength) octets)"
            # Sans Ollama, le pack répond 503 « embeddings indisponibles » : c'est
            # la preuve que ses fichiers ont été trouvés. 500 = pack absent du build.
            $codePack = & curl.exe -s -o "$env:TEMP\pack.json" -w "%{http_code}" `
              -X POST http://127.0.0.1:8000/api/references/pack
            if ($codePack -ne "503") {
              Get-Content "$env:TEMP\pack.json" -ErrorAction SilentlyContinue
              throw "Le pack d'exemples n'est pas résolu dans le binaire gelé (HTTP $codePack, attendu 503 sans Ollama)."
            }
            Write-Host "Pack d'exemples présent dans le binaire (503 attendu sans Ollama)"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Version
        id: version
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref.StartsWith("v")) { $v = $ref.Substring(1) }
          else { $v = "0.0.0-dev" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Installeur (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ steps.version.outputs.version }} `
            packaging\windows\installeur.iss
      - uses: actions/upload-artifact@v4
        with:
          name: BilanOrtho-Setup
          path: packaging/windows/Output/*.exe
          if-no-files-found: error
          # L'installeur pèse ~71 Mo et chaque push en produit un : à 90 jours
          # de rétention (défaut), le quota de stockage Actions sature et
          # l'upload échoue — donc aussi la publication de release, qui vient
          # juste après. Les installeurs qui comptent vivent dans les Releases
          # (stockage séparé) ; ces copies ne servent qu'à dépanner un build.
          retention-days: 7
      - name: Release publiée (sur tag)
        # Publication directe (plus de --draft) : la vérification de mise à jour
        # de l'app (app/maj.py) interroge releases/latest, qui ignore les
        # brouillons — une release non publiée serait invisible des utilisateurs.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
        run: |
          # Notes en fichier : la page de release est souvent la première (voire
          # la seule) page vue — un chemin relatif en texte brut n'y est pas
          # cliquable, d'où le lien complet vers le guide, épinglé sur le tag.
          # Here-string à quotes simples : les backticks Markdown y sont
          # littéraux ; ${{ github.ref_name }} est substitué par Actions avant
          # que pwsh ne voie le script.
          # NB : YAML désindente le bloc `run` — ces lignes arrivent en colonne
          # zéro dans le script, y compris le terminateur '@ (exigence pwsh).
          $notes = @'
          ## 📥 Installation

          **Téléchargez le fichier `BilanOrtho-Setup-x.y.z.exe` ci-dessous (section « Assets »)** — pas « Source code », qui n'est que le code du logiciel.

          Deux avertissements Windows sont normaux (application non signée, pas dangereuse) :

          1. **au téléchargement** (« fichier pas fréquemment téléchargé ») : « ⋯ » → « Conserver » → « Conserver quand même » ;
          2. **au premier lancement** (« Windows a protégé votre ordinateur ») : « Informations complémentaires » → « Exécuter quand même ».

          📖 **Guide pas à pas : [docs/guide-test.md](https://github.com/Delahaye-Alexandre/bilan-ortho/blob/${{ github.ref_name }}/docs/guide-test.md)**

          Premier lancement : connexion internet nécessaire (téléchargement d'Ollama et des modèles d'IA). Un problème ? Écrivez à alexandre-delahaye@outlook.fr.
          '@
          # Les notes ne parlaient que d'installation, jamais des changements :
          # la section de CHANGELOG.md correspondant au tag est reprise ici.
          $version = "${{ github.ref_name }}".TrimStart("v")
          $changements = python -c "import re,sys; s=open('CHANGELOG.md',encoding='utf-8').read(); m=re.search(r'^## ' + re.escape(sys.argv[1]) + r'[^\n]*\n(.*?)(?=^## |\Z)', s, re.S|re.M); print(m.group(1).strip() if m else '')" $version
          if ($changements) {
            $notes = $notes + "`n`n## ✨ Nouveautés de la version $version`n`n" + ($changements -join "`n")
          }
          Set-Content -Path notes-release.md -Value $notes -Encoding utf8
          gh release create "${{ github.ref_name }}" (Get-Item packaging/windows/Output/*.exe).FullName `
            --title "Bilan Ortho ${{ github.ref_name }}" `
            --notes-file notes-release.md
