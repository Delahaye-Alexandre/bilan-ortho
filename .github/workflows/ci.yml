name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Moindre privilège : lecture seule par défaut. Le workflow tourne aussi sur
# les pull requests — sur un dépôt public, n'importe qui peut en ouvrir une.
# Seul le job qui publie la release demande l'écriture.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff (config dans pyproject.toml)
        run: |
          pip install ruff
          ruff check .

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Dépendances (verrouillées)
        run: |
          pip install -r requirements-lock.txt
          pip install pytest
      - name: Dépendances OCR (Linux — le test OCR ne doit plus être sauté)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-fra ghostscript
          pip install ocrmypdf pillow
      - name: Tests (hors ligne — LLM/embeddings mockés ; -rs affiche tout skip)
        run: pytest tests/ -q -rs

  tests-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Tests UI (happy-dom — seule couverture du frontend)
        run: |
          # Toutes les suites, sans liste à tenir à jour : une suite ajoutée
          # mais oubliée ici restait verte… parce qu'elle ne tournait pas.
          for f in tests/ui/test_*_ui.mjs; do echo "== $f"; bun "$f" || exit 1; done

  build-windows:
    needs: [tests, tests-ui, lint]
    runs-on: windows-latest
    permissions:
      contents: write  # `gh release create` sur tag (étape « Release publiée »)
    env:
      # Signature de code Windows (Azure Artifact Signing, ex-Trusted Signing) :
      # facultative, activée dès que les secrets existent — voir
      # docs/signature-code.md. Sans elle, l'installeur reste non signé, comme
      # avant (avertissements SmartScreen au téléchargement manuel).
      SIGNATURE_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Garde-fou — le tag git doit égaler app.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $ver = python -c "from app import __version__; print(__version__)"
          if ($tag -ne $ver) {
            throw "Tag v$tag mais app.__version__ = $ver — bumpez app/__init__.py avant de tagger."
          }
      - name: Dépendances (verrouillées — build reproductible)
        run: |
          pip install -r requirements-lock.txt
          pip install pyinstaller pillow
      - name: Icône
        run: python packaging/windows/genere_icone.py packaging/windows/icone.ico
      - name: Build PyInstaller (onedir)
        run: pyinstaller packaging/pyinstaller/BilanOrtho.spec --noconfirm
      - name: Signature Authenticode du binaire (si configurée)
        if: env.SIGNATURE_AZURE == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\BilanOrtho
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Données embarquées — le VAD Silero est dans le build
        shell: pwsh
        run: |
          $vad = Get-ChildItem "dist\BilanOrtho\_internal\faster_whisper\assets\silero_vad*.onnx" -ErrorAction SilentlyContinue
          if (-not $vad) { throw "Modèle VAD Silero absent du build — la dictée planterait (collect_data_files('faster_whisper') dans le spec)" }
          Write-Host "VAD embarqué : $($vad.Name)"
      - name: Données embarquées — les polices reportlab sont dans le build
        shell: pwsh
        run: |
          # Même classe de bug que le VAD : reportlab lit ses métriques de
          # polices comme données de paquet. Absentes, l'export PDF échoue dans
          # l'app compilée seulement — invisible en développement et en tests.
          $afm = Get-ChildItem "dist\BilanOrtho\_internal\reportlab" -Recurse -Filter "*.afm" -ErrorAction SilentlyContinue
          if (-not $afm) { throw "Métriques de polices reportlab absentes du build — l'export PDF planterait (collect_all('reportlab') dans le spec)" }
          Write-Host "Polices reportlab embarquées : $($afm.Count) fichier(s) .afm"
      - name: Données embarquées — le pack de bilans d'exemple est dans le build
        shell: pwsh
        run: |
          # « Charger les bilans d'exemple » lit data/reference au runtime :
          # sans ces fichiers dans le build, le bouton échouerait dans l'app
          # compilée seulement.
          $pack = Get-ChildItem "dist\BilanOrtho\_internal\data\reference\*.txt" -ErrorAction SilentlyContinue
          if (-not $pack -or $pack.Count -lt 11) { throw "Pack de bilans d'exemple incomplet dans le build ($($pack.Count) fichier(s), 11 attendus) — datas du spec" }
          Write-Host "Pack embarqué : $($pack.Count) bilan(s) fictif(s)"
      - name: Fumée — le binaire compilé démarre et répond
        shell: pwsh
        run: |
          $env:BILAN_ORTHO_DATA_DIR = "$env:TEMP\bilan-ortho-fumee"
          $p = Start-Process -FilePath "dist\BilanOrtho\BilanOrtho.exe" -PassThru
          $ok = $false
          foreach ($i in 1..90) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/status" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { Start-Sleep -Milliseconds 500 }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "Le binaire n'a pas répondu sur /api/status" }
          Write-Host "Réponse : $($r.Content)"
      - name: Fumée — la dictée fonctionne dans le binaire gelé
        shell: pwsh
        run: |
          # La classe de bug qui a cassé la dictée entre v1.2 et v1.4 (données
          # faster-whisper absentes du build PyInstaller) n'est détectable
          # qu'en exerçant /api/transcribe sur le binaire compilé.
          $env:BILAN_ORTHO_DATA_DIR = "$env:TEMP\bilan-ortho-fumee-dictee"
          $p = Start-Process -FilePath "dist\BilanOrtho\BilanOrtho.exe" -PassThru
          try {
            $ok = $false
            foreach ($i in 1..90) {
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/status" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ok) { throw "Le binaire n'a pas répondu sur /api/status" }
            # Coffre de test + modèle Whisper « tiny » (léger) sur CPU.
            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8000/api/unlock" `
              -ContentType "application/json" -Body '{"passphrase":"passphrase-de-fumee-ci"}' | Out-Null
            Invoke-RestMethod -Method Put -Uri "http://127.0.0.1:8000/api/config" `
              -ContentType "application/json" -Body '{"overrides":{"stt":{"model":"tiny","device":"cpu"}}}' | Out-Null
            # 1 s de silence WAV 16 kHz : exerce tout le pipeline (VAD compris).
            python -c "import wave; w=wave.open(r'$env:TEMP\silence.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000); w.writeframes(b'\x00\x00'*16000); w.close()"
            $code = & curl.exe -s -o "$env:TEMP\transcribe.json" -w "%{http_code}" `
              -F "audio=@$env:TEMP\silence.wav;type=audio/wav" http://127.0.0.1:8000/api/transcribe
            if ($code -ne "200") {
              Get-Content "$env:TEMP\transcribe.json" -ErrorAction SilentlyContinue
              throw "La dictée a échoué dans le binaire gelé (HTTP $code)."
            }
            Write-Host "Dictée OK : $(Get-Content $env:TEMP\transcribe.json)"
            # Le binaire n'était sondé que sur l'API : si app/static sortait du
            # spec PyInstaller, la CI restait verte et l'app livrée affichait une
            # page blanche. Même angle mort pour l'export PDF (reportlab et ses
            # polices .afm) et pour le pack d'exemples (importer.PACK_DIR en mode
            # gelé) — revue 2026-08-11, 9.2.
            $page = Invoke-WebRequest -Uri "http://127.0.0.1:8000/" -UseBasicParsing -TimeoutSec 10
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch "Bilan Ortho") {
              throw "La page d'accueil du binaire gelé est vide ou absente."
            }
            $b = Invoke-RestMethod -TimeoutSec 60 -Method Post -Uri "http://127.0.0.1:8000/api/bilans" `
              -ContentType "application/json" -Body '{"domaines":[]}'
            $pdf = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/bilans/$($b.id)/export?format=pdf" `
              -UseBasicParsing -TimeoutSec 60
            if ($pdf.StatusCode -ne 200 -or "$($pdf.Headers['Content-Type'])" -notmatch "pdf" -or $pdf.RawContentLength -lt 500) {
              throw "L'export PDF a échoué dans le binaire gelé (HTTP $($pdf.StatusCode), $($pdf.RawContentLength) octets)."
            }
            Write-Host "Page et export PDF OK ($($pdf.RawContentLength) octets)"
            # Sans Ollama, le pack répond 503 « embeddings indisponibles » : c'est
            # la preuve que ses fichiers ont été trouvés. 500 = pack absent du build.
            $codePack = & curl.exe -s -o "$env:TEMP\pack.json" -w "%{http_code}" `
              -X POST http://127.0.0.1:8000/api/references/pack
            if ($codePack -ne "503") {
              Get-Content "$env:TEMP\pack.json" -ErrorAction SilentlyContinue
              throw "Le pack d'exemples n'est pas résolu dans le binaire gelé (HTTP $codePack, attendu 503 sans Ollama)."
            }
            Write-Host "Pack d'exemples présent dans le binaire (503 attendu sans Ollama)"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Version
        id: version
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref.StartsWith("v")) { $v = $ref.Substring(1) }
          else { $v = "0.0.0-dev" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Installeur (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ steps.version.outputs.version }} `
            packaging\windows\installeur.iss
      - name: Signature Authenticode de l'installeur (si configurée)
        if: env.SIGNATURE_AZURE == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\packaging\windows\Output
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Empreintes SHA-256 et signature Ed25519 des fichiers de release
        shell: pwsh
        env:
          BILAN_ORTHO_CLE_PRIVEE: ${{ secrets.BILAN_ORTHO_CLE_PRIVEE }}
        run: |
          # Chaîne de confiance de la mise à jour en un clic (app/maj.py) :
          # SHA256SUMS liste l'empreinte de l'installeur, SHA256SUMS.sig la
          # signe avec la clé Ed25519 dont la clé publique est embarquée dans
          # l'app. Sans clé sur un tag, on refuse de publier : une release non
          # signée serait inutilisable par l'installation automatique.
          $out = "packaging\windows\Output"
          $exe = Get-Item "$out\BilanOrtho-Setup-*.exe"
          $h = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLower()
          [IO.File]::WriteAllText("$out\SHA256SUMS", "$h  $($exe.Name)`n", (New-Object Text.UTF8Encoding $false))
          Get-Content "$out\SHA256SUMS"
          if (-not $env:BILAN_ORTHO_CLE_PRIVEE) {
            if ("${{ github.ref }}".StartsWith("refs/tags/v")) { throw "Secret BILAN_ORTHO_CLE_PRIVEE absent : impossible de signer la release (docs/signature-code.md)." }
            Write-Host "Pas de clé de signature (build hors tag) : SHA256SUMS non signé."
          } else {
            python -c "import base64,os,sys; from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey; k=Ed25519PrivateKey.from_private_bytes(base64.b64decode(os.environ['BILAN_ORTHO_CLE_PRIVEE'].strip())); d=open(sys.argv[1],'rb').read(); open(sys.argv[1]+'.sig','wb').write(base64.b64encode(k.sign(d))+b'\n')" "$out\SHA256SUMS"
            # Contrôle croisé avec la clé publique embarquée dans l'app : une
            # clé privée qui ne correspond pas serait détectée ici, pas chez
            # les praticiens.
            python -c "import sys; sys.path.insert(0,'.'); from app import maj; maj.verifier_signature(open(sys.argv[1],'rb').read(), open(sys.argv[1]+'.sig').read())" "$out\SHA256SUMS"
            Write-Host "SHA256SUMS signé et vérifié avec la clé publique de l'application."
          }
      - name: Mise à niveau — la version publiée précédente puis celle-ci par-dessus
        shell: pwsh
        # Borne dure : le 2026-09-03, quatre builds sont restés suspendus plus
        # d'une heure et demie sur cette étape (voir ci-dessous), sans release.
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Le bug des DLL résiduelles (audit) ne se voyait qu'en installant
          # PAR-DESSUS une version antérieure : on rejoue exactement ce chemin,
          # coffre existant compris, et la relance sur le même port qu'utilise
          # la mise à jour en un clic (/RELANCER, lanceur.py --port).
          #
          # Sans Ollama sur le poste, l'installeur (même silencieux) télécharge
          # OllamaSetup.exe (~1 Go) puis l'exécute en attendant sa fin — et sur
          # un runner, l'installeur d'Ollama ne rend jamais la main. Un
          # ollama.exe factice à l'emplacement que teste OllamaPresent() (même
          # test dans les versions précédentes) suffit à sauter ce détour :
          # l'application, elle, ne parle à Ollama que sur demande.
          $ollama = "$env:LOCALAPPDATA\Programs\Ollama"
          New-Item -ItemType Directory -Force $ollama | Out-Null
          Set-Content -Path "$ollama\ollama.exe" -Value "factice CI" -Encoding ascii
          $prev = "$env:TEMP\maj-precedente"
          New-Item -ItemType Directory -Force $prev | Out-Null
          try {
            gh release download --pattern "BilanOrtho-Setup-*.exe" --dir $prev --repo "${{ github.repository }}"
          } catch { Write-Host "Aucune release précédente : test de mise à niveau ignoré." ; exit 0 }
          $ancien = Get-ChildItem "$prev\BilanOrtho-Setup-*.exe" | Select-Object -First 1
          if (-not $ancien) { Write-Host "Aucun installeur précédent : test ignoré." ; exit 0 }
          $env:BILAN_ORTHO_DATA_DIR = "$env:TEMP\bilan-ortho-maj"
          $app = "$env:LOCALAPPDATA\Programs\BilanOrtho\BilanOrtho.exe"
          function Attendre-Status($port) {
            foreach ($i in 1..120) {
              try { $r = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/status" -TimeoutSec 2; return $r } catch { Start-Sleep -Milliseconds 500 }
            }
            throw "Le serveur n'a pas répondu sur le port $port"
          }
          # .WaitForExit() et non Start-Process -Wait : -Wait attend aussi les
          # processus descendants, donc l'application que l'installeur relance
          # (/RELANCER) — le build restait suspendu jusqu'au timeout.
          Write-Host "1. Installation de $($ancien.Name)"
          (Start-Process -PassThru -FilePath $ancien.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART").WaitForExit()
          $p = Start-Process -FilePath $app -PassThru
          $s = Attendre-Status 8000
          Write-Host "   version installée : $($s.version)"
          Invoke-RestMethod -TimeoutSec 60 -Method Post -Uri "http://127.0.0.1:8000/api/unlock" -ContentType "application/json" -Body '{"passphrase":"passphrase-de-mise-a-niveau-ci"}' | Out-Null
          $b = Invoke-RestMethod -TimeoutSec 60 -Method Post -Uri "http://127.0.0.1:8000/api/bilans" -ContentType "application/json" -Body '{"domaines":[]}'
          Stop-Process -Name BilanOrtho -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Write-Host "2. Installation de la version construite par-dessus, avec relance sur le port 8000"
          $neuf = Get-Item "packaging\windows\Output\BilanOrtho-Setup-*.exe"
          (Start-Process -PassThru -FilePath $neuf.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/RELANCER=8000").WaitForExit()
          $s2 = Attendre-Status 8000
          Write-Host "   version après mise à niveau : $($s2.version) (relancée par l'installeur)"
          # Entre deux releases, main porte le même numéro que la dernière
          # release publiée (le bump n'arrive qu'au tag) : le numéro ne peut
          # donc pas « changer », et le comparer bloquait tout push après une
          # publication. Ce qui compte : l'application relancée est celle qui
          # vient d'être construite — numéro de app/__init__.py et binaire
          # identique à dist\BilanOrtho (empreinte SHA-256).
          $construite = (Select-String -Path "app\__init__.py" -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          if ($s2.version -ne $construite) { throw "L'application relancée est en $($s2.version), la version construite est $construite." }
          $hInstalle = (Get-FileHash -Algorithm SHA256 $app).Hash
          $hConstruit = (Get-FileHash -Algorithm SHA256 "dist\BilanOrtho\BilanOrtho.exe").Hash
          if ($hInstalle -ne $hConstruit) { throw "Le BilanOrtho.exe installé n'est pas celui du build (empreintes différentes)." }
          if ($s.version -eq $construite) { Write-Host "   (même numéro que la dernière release : c'est la réinstallation par-dessus qui est vérifiée)" }
          if (-not $s2.db_exists) { throw "Le coffre existant n'est plus vu après la mise à niveau." }
          $u = Invoke-WebRequest -TimeoutSec 60 -Method Post -Uri "http://127.0.0.1:8000/api/unlock" -ContentType "application/json" -Body '{"passphrase":"passphrase-de-mise-a-niveau-ci"}' -UseBasicParsing
          if ($u.StatusCode -ne 200) { throw "Le coffre créé par l'ancienne version ne s'ouvre plus (HTTP $($u.StatusCode))." }
          $bilans = Invoke-RestMethod -TimeoutSec 60 -Uri "http://127.0.0.1:8000/api/bilans"
          if (-not ($bilans | Where-Object { $_.id -eq $b.id })) { throw "Le bilan créé avant la mise à niveau a disparu." }
          Write-Host "Mise à niveau OK : coffre ouvert, bilan #$($b.id) retrouvé."
          Stop-Process -Name BilanOrtho -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: BilanOrtho-Setup
          path: packaging/windows/Output/*.exe
          if-no-files-found: error
          # L'installeur pèse ~71 Mo et chaque push en produit un : à 90 jours
          # de rétention (défaut), le quota de stockage Actions sature et
          # l'upload échoue — donc aussi la publication de release, qui vient
          # juste après. Les installeurs qui comptent vivent dans les Releases
          # (stockage séparé) ; ces copies ne servent qu'à dépanner un build.
          retention-days: 7
      - name: Release publiée (sur tag)
        # Publication directe (plus de --draft) : la vérification de mise à jour
        # de l'app (app/maj.py) interroge releases/latest, qui ignore les
        # brouillons — une release non publiée serait invisible des utilisateurs.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
        run: |
          # Notes en fichier : la page de release est souvent la première (voire
          # la seule) page vue — un chemin relatif en texte brut n'y est pas
          # cliquable, d'où le lien complet vers le guide, épinglé sur le tag.
          # Here-string à quotes simples : les backticks Markdown y sont
          # littéraux ; ${{ github.ref_name }} est substitué par Actions avant
          # que pwsh ne voie le script.
          # NB : YAML désindente le bloc `run` — ces lignes arrivent en colonne
          # zéro dans le script, y compris le terminateur '@ (exigence pwsh).
          $notes = @'
          ## 📥 Installation

          **Téléchargez le fichier `BilanOrtho-Setup-x.y.z.exe` ci-dessous (section « Assets »)** — pas « Source code », qui n'est que le code du logiciel.

          Deux avertissements Windows sont normaux (application non signée, pas dangereuse) :

          1. **au téléchargement** (« fichier pas fréquemment téléchargé ») : « ⋯ » → « Conserver » → « Conserver quand même » ;
          2. **au premier lancement** (« Windows a protégé votre ordinateur ») : « Informations complémentaires » → « Exécuter quand même ».

          📖 **Guide pas à pas : [docs/guide-test.md](https://github.com/Delahaye-Alexandre/bilan-ortho/blob/${{ github.ref_name }}/docs/guide-test.md)**

          Premier lancement : connexion internet nécessaire (téléchargement d'Ollama et des modèles d'IA). Un problème ? Écrivez à alexandre-delahaye@outlook.fr.
          '@
          # Les notes ne parlaient que d'installation, jamais des changements :
          # la section de CHANGELOG.md correspondant au tag est reprise ici.
          $version = "${{ github.ref_name }}".TrimStart("v")
          $changements = python -c "import re,sys; s=open('CHANGELOG.md',encoding='utf-8').read(); m=re.search(r'^## ' + re.escape(sys.argv[1]) + r'[^\n]*\n(.*?)(?=^## |\Z)', s, re.S|re.M); print(m.group(1).strip() if m else '')" $version
          if ($changements) {
            $notes = $notes + "`n`n## ✨ Nouveautés de la version $version`n`n" + ($changements -join "`n")
          }
          Set-Content -Path notes-release.md -Value $notes -Encoding utf8
          # L'installeur, ses empreintes et leur signature : les trois fichiers
          # que l'app télécharge pour la mise à jour en un clic.
          gh release create "${{ github.ref_name }}" (Get-Item packaging/windows/Output/*.exe).FullName `
            packaging/windows/Output/SHA256SUMS packaging/windows/Output/SHA256SUMS.sig `
            --title "Bilan Ortho ${{ github.ref_name }}" `
            --notes-file notes-release.md
