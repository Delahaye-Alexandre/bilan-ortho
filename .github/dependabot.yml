# Surveillance des dépendances.
#
# L'application manipule des données de santé : une faille dans une dépendance
# doit remonter d'elle-même, sans attendre qu'on y pense. Ce fichier ne couvre
# que les *mises à jour* ; les *alertes* de vulnérabilité s'activent à part
# (Settings → Code security → Dependabot alerts).
#
# Le fichier verrouillé s'appelle `requirements-lock.txt` (et non `.lock`)
# précisément pour que Dependabot le lise : c'est lui que la CI et le build
# installent, donc lui qui détermine le logiciel réellement construit. Une
# proposition qui ne toucherait que `requirements.txt` ne changerait rien.
#
# Deux limites à connaître (constatées le 2026-11-20 : 89 alertes ouvertes,
# aucune proposition depuis le 2 novembre) :
# - Dependabot se met en pause tout seul quand, pendant 90 jours, personne n'a
#   fusionné ni fermé une de ses propositions, ni modifié ce fichier. Il
#   reprend à la première interaction. La veille ne tient donc que si
#   quelqu'un traite les propositions : c'est une étape de chaque release
#   (voir CLAUDE.md), pas un automatisme.
# - Ses propositions groupées ne montent que les versions mineures et
#   correctives. Un correctif de sécurité qui exige une version majeure
#   (Pillow 13, filelock 4, cryptography 50 en novembre 2026) passe par
#   scripts/verrouiller-dependances.sh.
version: 2
updates:
  # --- Dépendances Python -----------------------------------------------------
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Les planchers de `requirements.txt` sont volontairement souples : les
    # relever à chaque sortie amont n'apporte rien et noie les propositions
    # utiles. Ici, la contrainte du manifeste n'est touchée que si la nouvelle
    # version en sort — les versions épinglées du verrou, elles, sont toujours
    # proposées, et ce sont elles qui déterminent le logiciel construit.
    versioning-strategy: increase-if-necessary
    # Délai de carence : une version n'est proposée que sept jours après sa
    # publication (un paquet piégé est en général retiré avant). Même délai
    # que scripts/verrouiller-dependances.sh. Ne retarde pas les alertes de
    # sécurité, qui restent immédiates.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "Dépendances"
    groups:
      # Une seule proposition groupée pour les montées mineures et correctives :
      # le bruit hebdomadaire est le premier ennemi d'une veille tenue dans le
      # temps. Les montées majeures restent séparées — elles se relisent une par
      # une (sqlcipher3 et faster-whisper touchent au coffre et à la dictée).
      python-mineures:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- Actions GitHub (chaîne de build) ---------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "CI"
    groups:
      actions:
        patterns: ["*"]
